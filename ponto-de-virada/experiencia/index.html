<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#120f0a">
  <meta name="robots" content="noindex,nofollow">
  <title>O Ponto de Virada — Acesso à experiência</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#120f0a;color:#f5f0e8;font:15px/1.7 Arial,sans-serif}.card{width:min(100%,560px);padding:clamp(25px,6vw,48px);border:1px solid #c9a84c55;background:#17130b}.brand{font:700 13px Georgia,serif;letter-spacing:.1em}.brand b,.label{color:#c9a84c}.label{margin:44px 0 10px;font-size:10px;letter-spacing:.2em}.card h1{font:400 clamp(38px,8vw,56px)/1 Georgia,serif;margin:0 0 14px}.card p{color:#c8bfad}.card label{display:block;margin-top:22px;font-size:12px}.card input{display:block;width:100%;margin-top:8px;padding:14px;background:#100d08;border:1px solid #c9a84c55;color:#f5f0e8;font-size:15px}.card button{width:100%;min-height:52px;margin-top:15px;background:#c9a84c;border:0;color:#120f0a;font-weight:700}.card a{display:inline-block;margin-top:20px;color:#e8c96a;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">O CÓDIGO <b>INTERNO</b></div>
    <div class="label">O PONTO DE VIRADA · ACESSO</div>
    <h1>Sua experiência está aqui.</h1>
    <p>Entre com o e-mail usado na compra. Enviaremos um link seguro para confirmar seu acesso e abrir sua experiência.</p>
    <form id="accessForm"><label for="email">E-mail da compra</label><input id="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com"><button>Continuar para o acesso →</button></form>
    <a href="https://ocodigointerno.com.br/ponto-de-virada/">Voltar à página do Ponto de Virada</a>
  </main>
  <script>
    document.getElementById('accessForm').addEventListener('submit',event=>{event.preventDefault();const email=document.getElementById('email').value.trim();location.assign('https://app.ocodigointerno.com.br/ponto-de-virada/?email='+encodeURIComponent(email));});
  </script>
</body>
</html>
